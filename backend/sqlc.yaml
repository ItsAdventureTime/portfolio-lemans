version: '2'
sql:
  - schema: internal/db/migrations
    queries: queries.sql
    engine: postgresql
    gen:
      go:
        package: repository
        out: internal/repository
        sql_package: pgx/v5
        emit_json_tags: true
        json_tags_case_style: snake
        emit_db_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: cents
            go_type: int64
          - db_type: uuid
            go_type: string
            nullable: false
          - db_type: uuid
            nullable: true
            go_type:
              type: string
              pointer: true
