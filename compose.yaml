name: lemans

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: lemans_demo_db
    secrets:
      - db_password
    networks:
      - lemans-network
    volumes:
      # PostgreSQL 18+ uses /var/lib/postgresql. Keep this volume separate from
      # the old postgres:16 volume; major-version upgrades are not in-place.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lemans_demo_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  api:
    image: lemans-bridge-dashboard-go:demo-go
    build:
      context: .
      dockerfile: Dockerfile.go
    environment:
      DEMO_MODE: "true"
      LISTEN_ADDR: ":8080"
      B2_ENDPOINT: "${R2_ENDPOINT:?Set R2_ENDPOINT to a real Cloudflare R2 S3 endpoint}"
      B2_REGION: auto
      B2_BUCKET_NAME: portfolio-lemans
      B2_KEY_PREFIX: lemans/demo
      B2_ACCESS_KEY_ID_FILE: /run/secrets/r2_access_key_id
      B2_SECRET_ACCESS_KEY_FILE: /run/secrets/r2_secret_access_key
    entrypoint:
      - sh
      - -ec
      - |
        password="$$(cat /run/secrets/db_password)"
        case "$${password}" in
          (''|*[!A-Fa-f0-9]*) echo 'db_password must be a non-empty hex value' >&2; exit 1 ;;
        esac
        export DATABASE_URL="postgresql://postgres:$${password}@db:5432/lemans_demo_db"
        exec /lemans-api
    secrets:
      - db_password
      - r2_access_key_id
      - r2_secret_access_key
    networks:
      - lemans-network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    image: lemans-bridge-dashboard:demo-web
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_BASE_PATH: ""
    environment:
      API_BASE_URL: http://api:8080
      NEXT_PUBLIC_BASE_PATH: ""
      SITE_URL: https://lemans.delegateops.business
    networks:
      - lemans-network
      cloudflared-network:
        aliases:
          - lemans-web
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  seed:
    image: lemans-bridge-dashboard-go:demo-go
    profiles: [tools]
    entrypoint: ["/bin/sh", "-ec"]
    command: ["wget -q -O - --post-data='{}' --header='Content-Type: application/json' http://api:8080/admin/seed"]
    networks:
      - lemans-network
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

secrets:
  db_password:
    file: "${LEMANS_SECRET_DIR:?Set LEMANS_SECRET_DIR to the external secrets directory}/db_password"
  r2_access_key_id:
    file: "${LEMANS_SECRET_DIR:?Set LEMANS_SECRET_DIR to the external secrets directory}/r2_access_key_id"
  r2_secret_access_key:
    file: "${LEMANS_SECRET_DIR:?Set LEMANS_SECRET_DIR to the external secrets directory}/r2_secret_access_key"

networks:
  lemans-network:
    name: lemans-network
    internal: true
  cloudflared-network:
    name: "${CLOUDFLARED_NETWORK:?Set CLOUDFLARED_NETWORK to the existing tunnel network}"
    external: true

volumes:
  postgres_data:
    name: lemans_postgres_data_pg18
