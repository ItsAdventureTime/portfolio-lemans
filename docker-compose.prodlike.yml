services:
  app:
    container_name: lemans-prodlike-app
    image: lemans-bridge-dashboard:lts-slim
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - '127.0.0.1:3001:3000'
    env_file:
      - .env.prodlike
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres_prodlike_pass@db:5432/lemans_prodlike_db?schema=public
    depends_on:
      - db
    networks:
      - lemans-prodlike-net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    container_name: lemans-prodlike-db
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_prodlike_pass
      - POSTGRES_DB=lemans_prodlike_db
    # DB port 5432 is strictly NOT published to host
    volumes:
      - lemans-prodlike-db-data:/var/lib/postgresql/data
    networks:
      - lemans-prodlike-net

networks:
  lemans-prodlike-net:
    name: lemans-prodlike-net
    driver: bridge

volumes:
  lemans-prodlike-db-data:
    name: lemans-prodlike-db-data
